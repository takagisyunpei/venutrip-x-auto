name: VENUTRIP Daily Research and Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write

jobs:
  research-generate-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Research and generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: gpt-5.6-luna
          OPENAI_IMAGE_MODEL: gpt-image-2.5-flare
        run: python generate_daily.py

      - name: Commit generated media
        run: |
          git config user.name "VENUTRIP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated_media history.json daily_payload.json
          git diff --cached --quiet || git commit -m "Daily VENUTRIP content"
          git push
          echo "CURRENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Schedule Buffer posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: VENUTRIP_JP
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEDIA_SHA: ${{ env.CURRENT_SHA }}
        run: python schedule_buffer.py
